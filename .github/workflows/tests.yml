name: Lua hub checks
on:
  pull_request:
  push:
    branches: [main, feat/v1.0.0-private-hub]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -I build.py --check
      - run: python -I tests/check_source.py
      - run: python -I tests/run_tests.py
